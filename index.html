<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 駕駛疲勞監控測試</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #121212; color: #fff; padding: 15px; margin: 0; }
        video { width: 100%; max-width: 360px; border-radius: 12px; transform: scaleX(-1); background: #222; }
        #status { font-size: 1.1rem; font-weight: bold; margin: 10px 0; color: #00ff88; }
        #alert { font-size: 1.3rem; font-weight: bold; color: #ff4d4d; min-height: 40px; margin-top: 10px; }
        #log { font-size: 0.85rem; color: #aaa; background: #222; padding: 8px; border-radius: 8px; margin-top: 10px; word-break: break-all; }
    </style>
</head>
<body>
    <h2>AI 駕駛疲勞監控系統</h2>
    <video id="video" autoplay playsinline muted></video>
    <p id="status">狀態：連線中...</p>
    <div id="alert"></div>
    <div id="log">等待連線...</div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status');
        const alertText = document.getElementById('alert');
        const logText = document.getElementById('log');
        let frameCount = 0;
        
        // 建立 WebSocket 連線
        const ws = new WebSocket("wss://my-driver-ai-backend.onrender.com/ws/monitor");

        ws.onopen = () => {
            statusText.innerText = "狀態：已成功連線至雲端 AI！";
            logText.innerText = "連線成功，正在開啟鏡頭...";
            startCamera();
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            logText.innerText = `[${++frameCount}] 後端回應：` + JSON.stringify(data);
            
            if (data.status === "warning") {
                alertText.innerText = "⚠️ " + data.alert_text;
            } else {
                alertText.innerText = "";
            }
        };

        ws.onerror = (err) => {
            statusText.innerText = "連線發生錯誤";
            logText.innerText = "WebSocket Error";
        };

        ws.onclose = () => { 
            statusText.innerText = "狀態：連線已中斷"; 
        };

        // 開啟手機鏡頭
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 } } 
                });
                video.srcObject = stream;
                
                // 定時截圖並傳送（每秒約 3~5 幀）
                setInterval(sendFrame, 250);
            } catch (err) {
                statusText.innerText = "無法存取鏡頭，請確認瀏覽器相機權限。";
                logText.innerText = err.toString();
            }
        }

        function sendFrame() {
            if (ws.readyState !== WebSocket.OPEN) return;
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth || 320;
            canvas.height = video.videoHeight || 240;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Image = canvas.toDataURL('image/jpeg', 0.4);
            ws.send(base64Image);
        }
    </script>
</body>
</html>
